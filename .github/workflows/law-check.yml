name: 법령 개정 점검

on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 09:00(한국 시간)
  workflow_dispatch:       # Actions 탭에서 수동 실행

permissions:
  contents: write   # tools/law_meta.json 저장
  issues: write
  actions: write    # 표기가 바뀌면 배포 워크플로 실행

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: 공포번호 대조
        id: check
        env:
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: python3 tools/check_laws.py

      - name: 이슈로 알림
        if: steps.check.outputs.alert == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create law-check --color B60205 --description "법령 개정 자동 점검" --force || true
          num=$(gh issue list --label law-check --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file report.md
          else
            gh issue create --title "$(cat title.txt)" --body-file report.md --label law-check
          fi

      - name: 법령집 표기 저장 후 배포
        if: steps.check.outputs.meta_changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/law_meta.json
          git commit -m "법령집 표기(공포번호·시행일) 자동 갱신"
          git pull --rebase --autostash
          git push
          gh workflow run deploy.yml --ref main   # 봇 커밋은 자동 배포를 일으키지 않아 직접 실행

      - name: 점검 실패 표시
        if: steps.check.outputs.status == 'error'
        run: |
          echo "법령 점검 중 오류가 있었습니다. 위 '공포번호 대조' 단계와 이슈를 확인하세요."
          exit 1

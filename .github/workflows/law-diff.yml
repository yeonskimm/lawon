# 법ON: 법령 본문 대조(신구대조 보고서) — 2026. 9. 27. 신설
# - 매주 월요일 09:30(한국 시간) 법제처 현행·시행 예정 조문을 기준본(tools/law_snapshot)과 비교해
#   바뀐 조문이 있으면 이슈(law-diff 라벨)로 알린다. 같은 내용은 다시 알리지 않는다.
# - 수동 실행: mode=diff(대조) / mode=base(기준본 갱신 — 앱 반영을 마친 법령만, codes에 코드 입력. all이면 앱 대조표도 생성)
# - 발견·보고만 한다. 앱(index.html)은 고치지 않는다.
name: 법령 본문 대조

on:
  schedule:
    - cron: '30 0 * * 1'   # 매주 월요일 09:30(한국 시간)
  workflow_dispatch:
    inputs:
      mode:
        description: 'diff = 대조 / base = 기준본 갱신'
        type: choice
        options: [diff, base]
        default: diff
      codes:
        description: '법령 코드(쉼표로 구분, 예: GK,OSH) 또는 all'
        default: all

permissions:
  contents: write   # 기준본 저장(base)
  issues: write

concurrency:
  group: law-diff
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: 법령 대조
        id: diff
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          python3 tools/law_diff.py "${{ inputs.mode || 'diff' }}" "${{ inputs.codes || 'all' }}"
          cat law_diff_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 이슈로 알림
        if: steps.diff.outputs.alert == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIG: ${{ steps.diff.outputs.sig }}
        run: |
          gh label create law-diff --color 1D76DB --description "법령 본문 대조" --force || true
          num=$(gh issue list --label law-diff --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            if gh issue view "$num" --json body,comments --jq '.body, .comments[].body' | grep -q "law-diff:$SIG"; then
              echo "지난번과 같은 내용이라 알리지 않음"
            else
              gh issue comment "$num" --body-file law_diff_issue.md
            fi
          else
            gh issue create --title "$(cat law_diff_title.txt)" --body-file law_diff_issue.md --label law-diff
          fi

      - name: 기준본 저장
        if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/law_snapshot
          if git diff --cached --quiet; then echo "바뀐 기준본 없음"; exit 0; fi
          git commit -m "법령 대조 기준본 갱신: ${{ inputs.codes || 'all' }}"
          git pull --rebase --autostash
          git push

      - name: 실패 표시
        if: steps.diff.outputs.status == 'error'
        run: |
          echo "조회 실패가 있었습니다. 위 '법령 대조' 단계를 확인하세요."
          exit 1

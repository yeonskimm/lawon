# 법ON: 법령 본문 API 접속 시험 2차 (수동 실행 전용, 앱·배포에 영향 없음)
# 1차(9/27): 법제처·공공데이터포털 모두 30초 응답 없음 → 일시 장애인지, 해외(GitHub) 접속 차단인지 가린다.
# - 대조군: 주간 점검(law-check)이 쓰는 공공데이터포털 목록 조회
# - 법제처는 https·http 둘 다, 기다림 60초, 3번까지 다시 시도. 인증키는 로그에 출력하지 않는다.
name: 법령 API 접속 시험

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 접속 시험
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.parse, urllib.request
          NAME = '산업안전보건법'

          def get(url, tries=3):
              last = None
              for i in range(tries):
                  t0 = time.time()
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'lawon-api-test'})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.read().decode('utf-8', 'replace'), '%d번째 시도 %.1f초' % (i + 1, time.time() - t0)
                  except Exception as ex:
                      last = '%s %s (%.0f초)' % (type(ex).__name__, ex, time.time() - t0)
                      print('   - %d번째 시도 실패: %s' % (i + 1, last))
                      time.sleep(5)
              return None, last

          def line(title, text, how, n=400):
              print('\n=== ' + title + ' — ' + ('성공 · ' + how if text is not None else '실패 · ' + how) + ' ===')
              if text:
                  print(text[:n])

          try:
              print('이 시험 서버의 IP:', get('https://api.ipify.org', 1)[0])
          except Exception:
              pass

          # 대조군: 주간 점검과 같은 호출
          key = os.environ.get('LAW_API_KEY', '')
          if key:
              t, how = get('https://apis.data.go.kr/1170000/law/lawSearchList.do?' + urllib.parse.urlencode(
                  {'serviceKey': key, 'target': 'law', 'query': NAME, 'numOfRows': 3, 'pageNo': 1}))
              line('[대조] 공공데이터포털 목록 조회(주간 점검과 같음)', t, how)

          # ① 법제처 Open API
          oc = os.environ.get('LAW_OC', '')
          if not oc:
              print('\n[①] LAW_OC 비밀값이 없습니다.')
          for scheme in ['https', 'http']:
              if not oc:
                  break
              base = scheme + '://www.law.go.kr/DRF/'
              t, how = get(base + 'lawSearch.do?' + urllib.parse.urlencode(
                  {'OC': oc, 'target': 'law', 'type': 'JSON', 'query': NAME}))
              if t is not None and '검증에 실패' in t:
                  line('[①-%s] 법제처 목록 조회: 응답은 옴, 키/IP 검증 거절' % scheme, t, how)
                  continue
              line('[①-%s] 법제처 목록 조회' % scheme, t, how, 200)
              if t is None:
                  continue
              try:
                  laws = json.loads(t).get('LawSearch', {}).get('law', [])
                  laws = laws if isinstance(laws, list) else [laws]
                  hit = next((x for x in laws if x.get('법령명한글') == NAME), None)
                  if hit:
                      mst = hit.get('법령일련번호')
                      print('법령:', NAME, '/ MST:', mst, '/ 시행일:', hit.get('시행일자'))
                      b, how = get(base + 'lawService.do?' + urllib.parse.urlencode(
                          {'OC': oc, 'target': 'law', 'type': 'JSON', 'MST': mst, 'JO': '003800'}))
                      line('[①-%s] 법제처 본문 조회(제38조)' % scheme, b, how, 700)
                      break
              except Exception as ex:
                  print('읽기 오류:', ex, t[:200])
          print('\n시험 끝. 위 결과 화면을 캡처해 Claude에게 보내 주세요.')
          PY

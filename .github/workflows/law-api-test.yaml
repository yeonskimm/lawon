# 법ON: 법령 본문 API 접속 시험 (수동 실행 전용, 앱·배포에 영향 없음)
# 두 경로를 시험한다 — ① 법제처 Open API(LAW_OC) ② 공공데이터포털 공유서비스(LAW_API_KEY)
# 시험 조문: 산업안전보건법 제38조. 인증키는 로그에 출력하지 않는다(GitHub가 자동으로 가림).
name: 법령 API 접속 시험

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 접속 시험
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.parse, urllib.request
          NAME = '산업안전보건법'

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'lawon-api-test'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8', 'replace')

          def show(title, text, n=600):
              print('\n=== ' + title + ' ===')
              print(text[:n])

          try:
              print('이 시험 서버의 IP:', get('https://api.ipify.org'))
          except Exception:
              print('IP 확인 생략')

          # ① 법제처 Open API (law.go.kr, OC)
          oc = os.environ.get('LAW_OC', '')
          if not oc:
              print('\n[①] LAW_OC 비밀값이 없습니다.')
          else:
              base = 'https://www.law.go.kr/DRF/'
              try:
                  t = get(base + 'lawSearch.do?' + urllib.parse.urlencode(
                      {'OC': oc, 'target': 'law', 'type': 'JSON', 'query': NAME}))
                  if '검증에 실패' in t:
                      show('① 법제처 목록 조회 — 실패(IP·도메인 미등록으로 보임)', t)
                  else:
                      d = json.loads(t).get('LawSearch', {})
                      laws = d.get('law', [])
                      laws = laws if isinstance(laws, list) else [laws]
                      hit = next((x for x in laws if x.get('법령명한글') == NAME), None)
                      print('\n=== ① 법제처 목록 조회 — 성공 ===')
                      if hit:
                          mst = hit.get('법령일련번호')
                          print('법령:', NAME, '/ 일련번호(MST):', mst, '/ 시행일:', hit.get('시행일자'))
                          b = get(base + 'lawService.do?' + urllib.parse.urlencode(
                              {'OC': oc, 'target': 'law', 'type': 'JSON', 'MST': mst, 'JO': '003800'}))
                          show('① 법제처 본문 조회(제38조) 앞부분', b, 900)
              except Exception as ex:
                  print('\n[①] 오류:', type(ex).__name__, ex)

          # ② 공공데이터포털 공유서비스 (기존 주간 점검에 쓰는 키)
          key = os.environ.get('LAW_API_KEY', '')
          if key:
              for op in ['lawService.do']:
                  try:
                      t = get('https://apis.data.go.kr/1170000/law/' + op + '?' + urllib.parse.urlencode(
                          {'serviceKey': key, 'target': 'law', 'query': NAME, 'JO': '003800'}))
                      show('② 공공데이터포털 ' + op + ' 응답 앞부분', t, 900)
                  except Exception as ex:
                      print('\n[②] ' + op + ' 오류:', type(ex).__name__, ex)
          print('\n시험 끝. 위 결과 화면을 캡처해 Claude에게 보내 주세요.')
          PY

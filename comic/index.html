  document.getElementById('prev').onclick=function(){ if(p>1)show(p-1); };
  document.getElementById('next').onclick=function(){ if(p<CFG.n)show(p+1); };
  document.addEventListener('keydown',function(e){ if(e.key==='ArrowLeft'&&p>1)show(p-1); else if(e.key==='ArrowRight'&&p<CFG.n)show(p+1); });
  document.getElementById('close').onclick=function(){   // 새 창이면 닫힘. 닫히지 않는 환경(앱 창 안에서 열린 경우 등)은 앱 첫 화면으로
    try{ window.close(); }catch(e){}
    setTimeout(function(){ if(history.length>1)history.back(); else location.replace('../'); },250);
  };
  show(p);
})();
</script>
</body>
</html>
